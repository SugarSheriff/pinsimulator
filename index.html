<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keypad Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <header>
    <h1>Keypad Simulator</h1>
    <p>One guess every 24 hours. Get it wrong and the panel locks you out. No hints.</p>
  </header>

  <main>
    <section class="console">
      <span class="screw screw-tl"></span>
      <span class="screw screw-tr"></span>
      <span class="screw screw-bl"></span>
      <span class="screw screw-br"></span>
      <div class="led-row">
        <span class="led led-pwr" title="Power"></span>
        <span class="led-text">PWR</span>
        <span class="led led-lock" id="lockLed" title="Locked"></span>
        <span class="led-text">LOCK</span>
      </div>
      <div class="screen" id="screen">
        <div class="loading">Reading the panel...</div>
      </div>
      <div class="keypad" id="keypad"></div>
      <button class="enter-btn" id="enterBtn" disabled>ENTER</button>
    </section>

    <aside class="ledger">
      <h2>Panel Log</h2>
      <div class="stats" id="stats"></div>
      <p class="taunt" id="taunt">Loading your history of failure...</p>
    </aside>
  </main>
</div>

<script src="game.js"></script>
</body>
</html>
